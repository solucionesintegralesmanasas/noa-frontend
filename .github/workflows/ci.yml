# CI del frontend NOA (Spec a4: §8 "regresiones detectadas en CI").
# Verifica lint, auditoría a11y, build y pruebas unitarias en cada push/PR.
name: CI frontend

on:
  push:
    branches: [feature, develop, main]
  pull_request:
    branches: [feature, develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Las pruebas no tocan red: solo necesitan la variable presente al importar env.js (.env no se versiona).
      VITE_API_BASE_URL: /api/v1/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:a11y
      - run: npm run build
      - run: npm run test:unit
