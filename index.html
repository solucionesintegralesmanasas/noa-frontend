  <!--CRITICAL_LOGIN_CSS-->
  <script>
    // CSS crítico del login inline (critical/login.css). En el login (sin sesión) los CSS
    // completos y los scripts heredados de Falcon se cargan DESPUÉS del primer pintado para
    // no competir por ancho de banda con el JS de la app; en cualquier otra ruta o con
    // sesión activa se cargan bloqueantes como siempre, para no mostrar pantallas sin estilos.
    (function () {
      var h = location.hash, sesion = false;
      // App nativa (Capacitor): el token no vive en localStorage y los archivos son locales
      // (carga instantánea), así que no se difiere nada.
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) sesion = true;
      try {
        for (var i = 0; i < localStorage.length; i++) {
          if (localStorage.key(i).indexOf('secure_') > -1) { sesion = true; break; }
        }
      } catch (e) { sesion = true; }
      var login = !sesion && (h === '' || h === '#' || h === '#/' || h === '#/login');
      window.__noaLogin = login;
      var hojas = [
        ['/vendors/simplebar/simplebar.min.css', ''],
        ['/vendors/FontAwesome-pro/css/all.min.css', ''],
        ['/assets/css/theme.min.css', ' id="style-default"'],
        ['/assets/css/user.min.css', ' id="user-style-default"']
      ];
      if (!login) {
        for (var j = 0; j < hojas.length; j++) {
          document.write('<link rel="stylesheet" href="' + hojas[j][0] + '"' + hojas[j][1] + '>');
        }
        return;
      }
      // Login: se insertan tras el <style> crítico para conservar el orden de la cascada
      // (Falcon antes que el CSS de la app que Vite añade después).
      window.__noaCargarHojas = function () {
        var ancla = document.getElementById('critical-login');
        for (var k = hojas.length - 1; k >= 0; k--) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = hojas[k][0];
          if (hojas[k][1]) l.id = /id="([^"]+)"/.exec(hojas[k][1])[1];
          if (ancla) ancla.insertAdjacentElement('afterend', l); else document.head.appendChild(l);
        }
      };
    })();
  </script>
  <noscript>
    <link href="/vendors/simplebar/simplebar.min.css" rel="stylesheet" />
    <link href="/vendors/FontAwesome-pro/css/all.min.css" rel="stylesheet" />
    <link href="/assets/css/theme.min.css" rel="stylesheet" />
    <link href="/assets/css/user.min.css" rel="stylesheet" />
  </noscript>



  <script>
    var isRTL = JSON.parse(localStorage.getItem('isRTL'));
    if (isRTL) {
      // Solo RTL descarga sus hojas: se inyectan bajo demanda en vez de
      // descargar los dos themes y descartar uno
      function addRtlCss(href, id) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.id = id;
        document.head.appendChild(link);
      }
      addRtlCss('/assets/css/theme-rtl.min.css', 'style-rtl');
      addRtlCss('/assets/css/user-rtl.min.css', 'user-style-rtl');
      var linkDefault = document.getElementById('style-default');
      var userLinkDefault = document.getElementById('user-style-default');
      linkDefault.disabled = true;
      linkDefault.setAttribute('disabled', true);
      userLinkDefault.disabled = true;
      userLinkDefault.setAttribute('disabled', true);
      document.querySelector('html').setAttribute('dir', 'rtl');
    }
  </script>

  <!-- Falcon Scripts (heredados). Requeridos por theme.js y vistas: simplebar, popper+bootstrap
       (window.bootstrap), anchorjs, is, lodash (window._ ×11) y theme.js. No quitar sin auditar
       theme.js (ARQ-012: auditado 2026-09-23, todo en uso).
       Fuera del login se cargan diferidos como siempre (mantienen orden, tras main.js);
       en el login se cargan tras el primer pintado y en el mismo orden. -->
  <script>
    (function () {
      var scripts = [
        '/vendors/simplebar/simplebar.min.js',
        '/vendors/popper/popper.min.js',
        '/vendors/bootstrap/bootstrap.min.js',
        '/vendors/anchorjs/anchor.min.js',
        '/vendors/is/is.min.js',
        '/vendors/lodash/lodash.min.js',
        '/assets/js/theme.js'
      ];
      if (!window.__noaLogin) {
        for (var i = 0; i < scripts.length; i++) {
          document.write('<script src="' + scripts[i] + '" defer><\/script>');
        }
        return;
      }
      function cargar() {
        if (window.__noaCargarHojas) window.__noaCargarHojas();
        for (var j = 0; j < scripts.length; j++) {
          var e = document.createElement('script');
          e.src = scripts[j];
          e.async = false; // conserva el orden de ejecución
          document.body.appendChild(e);
        }
      }
      function alTerminar() {
        if (window.requestIdleCallback) window.requestIdleCallback(cargar, { timeout: 3000 });
        else setTimeout(cargar, 300);
      }
      if (document.readyState === 'complete') alTerminar();
      else window.addEventListener('load', alTerminar);
    })();
  </script>
  <noscript>
    <script src="/vendors/simplebar/simplebar.min.js"></script>
    <script src="/vendors/popper/popper.min.js"></script>
